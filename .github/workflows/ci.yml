name: CI/CD

on:
  push:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    services:
      # Same major as docker-compose.prod.yml (postgres:17-alpine).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chpu
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chpu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Dummy values for CI only (see .env.example / .env.prod.example).
      DEBUG: 'False'
      SECRET_KEY: ci-only-dummy-secret-key-not-used-anywhere-else
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/chpu
      FINANCE_PASSWORD: ci-finance-password
      PAYMENT_GATEWAY: mock
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13' # Dockerfile: python:3.13-slim
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-prod.txt

      - name: Install dependencies
        # requirements-prod.txt = requirements.txt + gunicorn + psycopg (as in the Docker image)
        run: pip install -r requirements-prod.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test --noinput

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # Dockerfile: node:22-alpine
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (VPS, docker compose)
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Update over SSH (DEPLOY.md, «Обновление после правок кода»)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"
            git pull
            # Migrations, collectstatic and the frontend bundle are applied by
            # deploy/entrypoint.sh when the web container starts.
            docker compose -f docker-compose.prod.yml up -d --build
