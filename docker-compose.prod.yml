# Прод-стек: Django (gunicorn) + PostgreSQL.
# nginx НЕ здесь — он живёт на хосте (/etc/nginx/sites-available/chpucenter.com)
# и проксирует на 127.0.0.1:8001, а статику/медиа/фронтенд отдаёт напрямую
# из /srv/chpucenter/*.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Порядок при выкладке: db (healthy) → migrate (разово: миграции, статика,
# фронтенд в каталог nginx; завершается) → web и бот. Если migrate упал, web не
# пересоздаётся — продолжает работать прежний контейнер (см. DEPLOY.md).

# Ротация логов контейнеров: без неё json-file растёт без предела и однажды
# съедает диск вместе с копиями. 5 файлов по 10 МБ на каждый сервис.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Именно env_file, а не environment с ${...}: подстановка в compose-файле
    # читает только шелл и файл с именем ровно «.env», про .env.prod она не
    # знает. env_file же отдаёт переменные прямо в контейнер — то, что нужно
    # образу postgres (POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD).
    env_file: .env.prod
    logging: *default-logging
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Наружу не публикуем: база доступна только контейнеру web по внутренней
    # сети compose. Для psql заходим через `docker compose exec db psql`.
    healthcheck:
      # $$ — экранирование: подставит не compose, а шелл внутри контейнера.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Разовая выкладка: миграции, таблица кеша, collectstatic, фронтенд в
  # /srv/chpucenter/frontend. Один контейнер вместо «каждый при старте»: иначе
  # web и бот гнали бы migrate одновременно, а упавшая миграция превращалась в
  # бесконечный перезапуск. restart: "no" — упал, значит упал, остановка видна
  # в выводе `up -d` и в `logs migrate`.
  migrate:
    build: .
    image: chpucenter-app:latest
    restart: "no"
    env_file: .env.prod
    command: ["release"]
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /srv/chpucenter/static:/app/staticfiles
      - /srv/chpucenter/media:/app/media
      - /srv/chpucenter/frontend:/app/frontend_public

  web:
    build: .
    image: chpucenter-app:latest
    restart: unless-stopped
    env_file: .env.prod
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Слушаем только localhost — снаружи в контейнер попасть можно лишь через
    # nginx на хосте.
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      # Хостовые каталоги, из которых nginx раздаёт файлы напрямую.
      - /srv/chpucenter/static:/app/staticfiles
      - /srv/chpucenter/media:/app/media
      - /srv/chpucenter/frontend:/app/frontend_public
    healthcheck:
      # /api/health/ делает SELECT 1: 200 = Django жив И база отвечает, 503 =
      # приложение поднято, но до базы не достучаться. Прежняя проверка (страница
      # входа в админку) в базу не ходила вовсе и показывала healthy при упавшей
      # Postgres. Хост подставляем явно, иначе ALLOWED_HOSTS отдаст 400 на
      # 127.0.0.1. Эндпоинт без авторизации и ничего, кроме статуса, не отдаёт.
      test: ["CMD-SHELL", "curl -fsS -H 'Host: chpucenter.com' http://127.0.0.1:8000/api/health/ -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Миграции к этому моменту уже применены сервисом migrate, поэтому web
      # поднимается быстро; запас на медленный диск и холодный старт воркеров.
      start_period: 60s

  # Телеграм-бот клиентов (long polling). Включать, когда появится токен:
  # docker compose -f docker-compose.prod.yml --profile bot up -d
  # Миграции и collectstatic бот не запускает: это делает только migrate.
  customer-bot:
    build: .
    image: chpucenter-app:latest
    restart: unless-stopped
    env_file: .env.prod
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["bot"]
    command: ["python", "manage.py", "run_customer_bot"]

volumes:
  pgdata:
