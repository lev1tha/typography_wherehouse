<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Название системы в интерфейсе — «ЧПУ Система». «Storekeeper» было
         внутренним рабочим именем, но висело в заголовке вкладки, и его видел
         клиент, открывая ссылку на свои заказы. -->
    <title>ЧПУ Система — склад и продажи</title>
    <!-- PWA (волна 2, XL-12): установка на экран телефона. Работа офлайн —
         только корзина кассы (localStorage) и баннер «нет связи»; оформлять
         заказ без связи нельзя. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f0a868" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ЧПУ Система" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Тема ставится ДО отрисовки: если делать это в React, страница успевает
         мигнуть белым на каждой загрузке — в тёмном цеху это заметно. -->
    <script>
      try {
        var t = localStorage.getItem("cloude-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
